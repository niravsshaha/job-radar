name: Refresh job radar
on:
  schedule:
    - cron: "0 12 * * *"   # 7:00 AM Central (12:00 UTC) every day
  workflow_dispatch: {}      # run it by hand from the Actions tab
  push:
    paths: ["radar.py", "template.html"]
concurrency:
  group: refresh
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless browser (for Meta careers; the build still runs if this fails)
        run: pip install playwright && python -m playwright install --with-deps chromium || true
      - name: Rebuild dashboard
        run: python3 radar.py
        env:  # optional free Jooble key, saved under Settings → Secrets and variables → Actions
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
      - name: Commit if changed
        run: |
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add index.html jobs.json
          git diff --cached --quiet || git commit -m "Daily job refresh $(date -u +%F)"
          # The page also saves sync.json to this repo, so catch up before pushing.
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && exit 0; sleep 10; done
          exit 1
